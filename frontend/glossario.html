<!DOCTYPE html>
<html lang="pt-BR" class="h-full scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glossário — ImpactoCidadão</title>
    <meta name="description" content="Siglas e termos de economia, orçamento público e leis, explicados em linguagem simples.">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/tailwind-config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        :focus-visible { outline: 2px solid #A92823; outline-offset: 2px; }
        tr:target > td { background: rgba(14, 165, 233, .12); }
    </style>
    <link rel="stylesheet" href="assets/brutalista.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-full flex flex-col transition-colors duration-200">

<a href="#conteudo" class="sr-only focus:not-sr-only focus:absolute focus:z-50 focus:bg-white focus:text-slate-900 focus:p-3">Ir para o conteúdo</a>
<div id="cabecalho"></div>

<main id="conteudo" class="max-w-5xl mx-auto px-4 sm:px-6 pt-6 pb-10 flex-grow w-full">
    <h1 class="text-2xl font-extrabold tracking-tight">Glossário</h1>
    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Siglas e termos usados no site, do jeito técnico e do jeito simples.</p>

    <div class="mt-4 flex flex-wrap items-center gap-2 text-sm">
        <div class="relative flex-grow min-w-[12rem] max-w-md">
            <label for="busca" class="sr-only">Buscar termo</label>
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs" aria-hidden="true"></i>
            <input id="busca" type="search" maxlength="80" placeholder="Buscar sigla ou termo…" autocomplete="off"
                   class="w-full pl-8 pr-3 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none">
        </div>
        <label class="sr-only" for="filtroSecao">Seção</label>
        <select id="filtroSecao" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2"></select>
        <span id="contagem" class="ml-auto text-xs text-slate-500" aria-live="polite"></span>
    </div>

    <div id="estado" class="mt-4"></div>
    <div id="tabelas" class="mt-4 space-y-8"></div>
</main>

<div id="rodape"></div>

<script src="assets/comum.js"></script>
<script>
renderLayout('glossario');

const TITULOS = {
    indicadores_economicos: 'Indicadores econômicos e fiscais',
    reservas_e_fmi: 'Reservas internacionais e FMI',
    orcamento_publico: 'Orçamento público',
    fases_da_despesa: 'Fases da despesa',
    divida_e_titulos: 'Dívida e títulos públicos',
    processo_legislativo: 'Processo legislativo',
    fontes_de_dados: 'Fontes de dados',
};
let SECOES = [];   // [{ id, titulo, termos: [{ sigla, ...campos }] }]

const norm = (t) => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

function desenhar() {
    const q = norm($('busca').value.trim());
    const secao = $('filtroSecao').value;
    let total = 0;
    const html = SECOES.filter((s) => !secao || s.id === secao).map((s) => {
        const termos = s.termos.filter((t) => !q || norm([t.sigla, t.termo_tecnico, t.nome_cidadao, t.explicacao_simples, t.categoria].join(' ')).includes(q));
        if (!termos.length) return '';
        total += termos.length;
        return `<section aria-labelledby="s-${esc(s.id)}">
            <h2 id="s-${esc(s.id)}" class="text-lg font-bold mb-2">${esc(s.titulo)}</h2>
            <div class="overflow-x-auto rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800">
                <table class="w-full text-sm">
                    <caption class="sr-only">${esc(s.titulo)}</caption>
                    <thead class="bg-slate-100 dark:bg-slate-700/60 text-left text-xs uppercase tracking-wide text-slate-500 dark:text-slate-300">
                        <tr><th scope="col" class="p-3 w-40">Sigla</th><th scope="col" class="p-3">Termo técnico</th><th scope="col" class="p-3">Em linguagem simples</th><th scope="col" class="p-3 w-40">Categoria</th></tr>
                    </thead>
                    <tbody>${termos.map((t) => `<tr id="${esc(t.sigla)}" class="border-t border-slate-100 dark:border-slate-700 align-top">
                        <th scope="row" class="p-3 text-left font-bold whitespace-nowrap">${esc(t.sigla.replace(/_/g, ' '))}</th>
                        <td class="p-3 text-slate-600 dark:text-slate-300">${esc(t.termo_tecnico)}</td>
                        <td class="p-3"><p class="font-semibold">${esc(t.nome_cidadao)}</p><p class="text-slate-600 dark:text-slate-400 mt-0.5">${esc(t.explicacao_simples)}</p></td>
                        <td class="p-3"><span class="inline-block px-2.5 py-1 rounded-full text-[11px] font-semibold bg-brand-50 dark:bg-brand-950 text-brand-800 dark:text-brand-300">${esc(t.categoria)}</span></td>
                    </tr>`).join('')}</tbody>
                </table>
            </div>
        </section>`;
    }).join('');
    $('tabelas').innerHTML = html || '<p class="text-sm text-slate-500">Nenhum termo encontrado. Tente outra palavra.</p>';
    $('contagem').textContent = `${total} termo${total === 1 ? '' : 's'}`;
}

(async function iniciar() {
    try {
        const resp = await fetch('assets/glossario.json');
        if (!resp.ok) throw new Error(`Erro ${resp.status} ao carregar o glossário`);
        const dados = await resp.json();
        SECOES = Object.entries(dados).map(([id, termos]) => ({
            id, titulo: TITULOS[id] || id.replace(/_/g, ' '),
            termos: Object.entries(termos).map(([sigla, v]) => ({ sigla, ...v })),
        }));
        $('filtroSecao').innerHTML = '<option value="">Todas as seções</option>' + SECOES.map((s) => `<option value="${esc(s.id)}">${esc(s.titulo)}</option>`).join('');
        desenhar();
        if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
    } catch (e) { $('estado').innerHTML = mensagemErro(e); }
})();
$('busca').addEventListener('input', debounce(desenhar, 120));
$('filtroSecao').addEventListener('change', desenhar);
</script>
</body>
</html>
